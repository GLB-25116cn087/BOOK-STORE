<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L. Bajaj Online Book Store - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Outer Container -->
    <div class="container">
        
        <!-- Header -->
        <div class="header">
            <div class="logo-box">
                <img src="logo.png" alt="Logo">
            </div>
            <div class="header-content">
                <h1>G.L. Bajaj Online Book Store</h1>
                <nav class="nav-links">
                    <a href="#">Home</a> |
                    <a href="#">Login</a> |
                    <a href="#">Register</a> |
                    <a href="#">Catalogue</a> |
                    <a href="#">Cart</a>
                </nav>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-body">
            
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>Categories</h3>
                <div class="category-item">CSE Books</div>
                <div class="category-item">ECE Books</div>
                <div class="category-item">AI Books</div>
            </div>

            <!-- Registration Form Content -->
            <div class="form-content">
                <h2>Registration Form</h2>
                
                <form action="#" method="post">
                    <table>
                        <tr>
                            <td><label for="name">Name:</label></td>
                            <td><input type="text" id="name" name="name" required></td>
                        </tr>
                        <tr>
                            <td><label for="password">Password:</label></td>
                            <td><input type="password" id="password" name="password" required></td>
                        </tr>
                        <tr>
                            <td><label for="email">E-mail ID:</label></td>
                            <td><input type="email" id="email" name="email" required></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone Number:</label></td>
                            <td><input type="text" id="phone" name="phone" required></td>
                        </tr>
                        <tr>
                            <td>Sex:</td>
                            <td class="radio-group">
                                <label><input type="radio" name="sex" value="male"> Male</label>
                                <label><input type="radio" name="sex" value="female"> Female</label>
                            </td>
                        </tr>
                        <tr>
                            <td>Date of Birth:</td>
                            <td>
                                <select name="dob_day">
                                    <option value="">Day</option>
                                    <!-- Days 1-31 -->
                                    <script>
                                        for(let i=1; i<=31; i++){
                                            document.write(`<option value="${i}">${i}</option>`);
                                        }
                                    </script>
                                </select>
                                <select name="dob_month">
                                    <option value="">Month</option>
                                    <option value="Jan">Jan</option>
                                    <option value="Feb">Feb</option>
                                    <option value="Mar">Mar</option>
                                    <option value="Apr">Apr</option>
                                    <option value="May">May</option>
                                    <option value="Jun">Jun</option>
                                    <option value="Jul">Jul</option>
                                    <option value="Aug">Aug</option>
                                    <option value="Sep">Sep</option>
                                    <option value="Oct">Oct</option>
                                    <option value="Nov">Nov</option>
                                    <option value="Dec">Dec</option>
                                </select>
                                <select name="dob_year">
                                    <option value="">Year</option>
                                    <!-- Years 1990-2026 -->
                                    <script>
                                        for(let i=2026; i>=1990; i--){
                                            document.write(`<option value="${i}">${i}</option>`);
                                        }
                                    </script>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Languages Known:</td>
                            <td class="checkbox-group">
                                <label><input type="checkbox" name="language" value="English"> English</label>
                                <label><input type="checkbox" name="language" value="Telugu"> Telugu</label>
                                <label><input type="checkbox" name="language" value="Hindi"> Hindi</label>
                                <label><input type="checkbox" name="language" value="Tamil"> Tamil</label>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="address">Address:</label></td>
                            <td><textarea id="address" name="address" rows="4" cols="30" placeholder=" Enter the address"></textarea></td>
                        </tr>
                        <tr>
                            <td colspan="2" class="button-row">
                                <button type="submit" class="submit-btn">Register</button>
                                <button type="reset" class="reset-btn">Reset</button>
                            </td>
                        </tr>
                    </table>
                </form>

            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <p>@Created by RUKMANI YADAV</p>
            <p>Roll no. 2501920110318</p>
        </div>

    </div>

</body>
</html>
