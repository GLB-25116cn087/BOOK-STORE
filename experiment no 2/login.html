<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page - G.L. Bajaj Online Book Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo-section">
      <img src="logo.png" alt="Logo" class="logo">
      <h1>G.L. Bajaj Online Book Store</h1>
    </div>
    <nav class="navbar">
      <a href="#">Home</a>

      <a href="#" class="active">Login</a>
      <a href="#">Register</a>
      <a href="#">Catalogue</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul>
        <li><a href="#">CSE Books</a></li>
        <li><a href="#">ECE Books</a></li>
        <li><a href="#">Mechanical Books</a></li>
        <li><a href="#">Civil Books</a></li>
      </ul>
    </aside>

    <main class="content">
      <div class="login-box">
        <h2>Login Page</h2>
        <form>
          <input type="text" placeholder="Username" required>
          <input type="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
      </div>
    </main>
  </div>

  <footer class="footer">
    <p>Created by  RUKMANI YADAV| Roll No: 2501920110318</p>
  </footer>

</body>
</html>
